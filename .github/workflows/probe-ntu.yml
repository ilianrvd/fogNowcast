name: probe-ntu
# Manual one-off probe: a single request to bgtoll.bg /mto/data. No schedule.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-ntu
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/probe_ntu.py
