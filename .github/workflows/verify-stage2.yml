name: verify-stage2
# Manual: stage-2 verification (docs/verification.md). Raw ICON-EU single runs vs persistence vs residual
# correction, leads 0-6 h. One request to Open-Meteo per run (~225 runs for Oct-Nov), all points at once,
# 2 in parallel (4 gave HTTP 429); fetched runs are cached between attempts. April-November is ~940 runs.
on:
  workflow_dispatch:
    inputs:
      months:
        description: "NTU archive months to read"
        default: "2026-10 2026-11"
      train:
        description: "Training period (start:end)"
        default: "2026-10-01:2026-10-31"
      fog_train:
        description: "Training period of the fog model (start:end)"
        default: "2026-04-05:2026-10-31"
      test:
        description: "Test period (start:end)"
        default: "2026-11-01:2026-11-24"
      publish:
        description: "Publish the result to branch analysis-verification"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: verify-stage2
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - name: Restore fetched model runs
        # runs fetched by earlier attempts (also cancelled or failed ones, see the save step) are reused
        uses: actions/cache/restore@v4
        with:
          path: .cache/single-runs-v3
          key: single-runs-v3-${{ github.run_id }}
          restore-keys: single-runs-v3-
      - name: Fetch observations
        run: |
          mkdir -p "$RUNNER_TEMP/archive" "$RUNNER_TEMP/metar"
          for m in ${{ inputs.months }}; do
            git fetch --depth 1 origin "archive-$m"
            git show FETCH_HEAD:"ntu_$m.csv.gz" > "$RUNNER_TEMP/archive/ntu_$m.csv.gz"
          done
          git fetch --depth 1 origin analysis-metar
          for i in LBSF LBBG LBWN LBPD LBGO; do
            git show FETCH_HEAD:"metar_$i.csv.gz" > "$RUNNER_TEMP/metar/metar_$i.csv.gz"
          done
      - run: >
          python -m verification.build --archive-dir "$RUNNER_TEMP/archive" --metar-dir "$RUNNER_TEMP/metar"
          --out "$RUNNER_TEMP/out" --train "${{ inputs.train }}" --test "${{ inputs.test }}"
          --fog-train "${{ inputs.fog_train }}"
          --cache-dir .cache/single-runs-v3
      - name: Save fetched model runs
        # also when the run fails or is cancelled at the time limit, so that nothing fetched is lost
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: .cache/single-runs-v3
          key: single-runs-v3-${{ github.run_id }}
      - if: ${{ inputs.publish }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/publish_verification.sh "$RUNNER_TEMP/out"
