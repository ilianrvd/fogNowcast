name: ingest-ntu-live
# Live NTU feed. Triggered every 15 minutes by cron-job.org (workflow_dispatch), not by GitHub's own cron.
# One request to /mto/data per run (NTU rule: at most one per 15 minutes, only from GitHub Actions).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-ntu-live
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch published branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site fb live
          for pair in "gh-pages:site" "archive-fallback:fb" "archive-live:live"; do
            br="${pair%%:*}"; dir="${pair##*:}"
            # exit code 2 = branch does not exist (first run); any other failure stops the run, so that a
            # network error is never mistaken for an empty branch (which would also lose the request time)
            rc=0; git ls-remote --exit-code --heads origin "$br" >/dev/null 2>&1 || rc=$?
            if [ "$rc" = 0 ]; then
              rm -rf "$dir"
              # archive-fallback gets normal (non-forced) commits: a shallow clone made GitHub reject
              # some of those pushes ("missing necessary objects", 3 of 20 runs on 2026-11-26), so it is
              # cloned in full (small: one CSV per day). The other two branches are single-commit, force-pushed.
              depth="--depth 1"; [ "$br" = archive-fallback ] && depth=""
              git clone -q $depth --single-branch --branch "$br" "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$dir"
            elif [ "$rc" != 2 ]; then
              echo "git ls-remote failed ($rc) for $br"; exit 1
            fi
          done
      - run: python -m ingest.ntu_live --site site --fallback-archive fb --live-archive live
      - name: Fog points (uncalibrated)
        # corrected model + observation for the 26 points (docs/fog_points.md); the NTU ingest does not depend on it:
        # on any failure the previous fog/fog_points.json stays in site/ (its generated_at shows how old it is)
        continue-on-error: true
        run: |
          mkdir -p site/fog
          curl -fsS --retry 2 --max-time 60 -o model.json https://ilianrvd.github.io/multiconvect/latest_points.json
          metar=""
          if curl -fsS --retry 2 --max-time 60 -o metar.json https://ilianrvd.github.io/nowcasting-public/obs/metar_latest.json; then metar="--metar metar.json"; fi
          python -m core.fog_points --model model.json --ntu site/obs/ntu_latest.json $metar --out site/fog/fog_points.json --manifest site/manifest.json
      - name: Fog polygons (uncalibrated)
        # corrected ICON-EU grid + all stations, 0-6 h (docs/fog_polygons.md); independent of the NTU ingest:
        # on any failure the previous fog/fog_polygons.geojson stays (its generated_at shows how old it is)
        continue-on-error: true
        run: |
          pip install -q numpy contourpy
          base=https://ilianrvd.github.io/multiconvect
          curl -fsS --retry 2 --max-time 120 -o fields.npz $base/fog_fields_icon_eu.npz
          curl -fsS --retry 2 --max-time 60 -o fields_meta.json $base/fog_fields_meta.json
          metar=""
          if [ -s metar.json ]; then metar="--metar metar.json"; fi
          python -m core.fog_polygons --npz fields.npz --meta fields_meta.json --ntu site/obs/ntu_latest.json $metar \
            --out site/fog/fog_polygons.geojson --manifest site/manifest.json
      - name: Station page
        # the page (web/index.html) is published with the data; on a skipped or failed run it changes nothing
        run: cmp -s web/index.html site/index.html || cp web/index.html site/index.html
      - name: Publish
        # also after a failed ingest, so that the time of the request attempt (ntu_fetch_state.json) is kept;
        # the data files are unchanged in that case
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/publish_live.sh
